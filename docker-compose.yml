name: tamagawa-test-platform

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/mai-mu/universal-test-platform:latest}
    environment:
      NODE_ENV: production
      PORT: "3000"
      TZ: ${TZ:-Asia/Shanghai}
      TEST_PLATFORM_DATA_DIR: /app/data
      TEST_PLATFORM_BACKUP_DIR: /app/data/backups
    volumes:
      - ./data:/app/data
    expose:
      - "3000"
    networks:
      proxy:
        aliases:
          - test-platform
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    name: ${PROXY_NETWORK:-web}
    external: true
